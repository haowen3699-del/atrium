[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-fleet-atrium"
version = "0.3.27"
description = "Atrium 机队看板：一个包=完整服务（UI + 本机进程扫描 + 局域网自动发现 + 团队密钥），装完即用"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["atrium", "opencode", "cc-connect", "fleet", "dashboard", "openspec", "spec-driven"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: Web Environment",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/haowen3699-del/atrium"
Repository = "https://github.com/haowen3699-del/atrium"
Issues = "https://github.com/haowen3699-del/atrium/issues"
Changelog = "https://github.com/haowen3699-del/atrium/releases"

[project.scripts]
atrium = "atrium.cli:main"
atrium-server = "atrium.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["atrium"]
include-package-data = true

[tool.setuptools.package-data]
atrium = ["app/atrium.mjs", "app/web/**/*", "runtime/*"]
